        '503':
          description: A temporary server error occurred. Retry again later or report this error if it persists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CustomerErrorResponse'
        '200':
          description: List of mapped vehicles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleMappingDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/VehicleMappingDto'
      security:
      - bearerAuth: []
components:
  schemas:
    TyreWearDto:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        status:
          type: string
        statusColor:
          type: string
          enum:
          - RED
          - YELLOW
          - GREEN
          - GREY
        dueMileage:
          type: integer
          format: int32
        unit:
          type: string
          enum:
          - KILOMETER
          - MILE
    BusinessErrorDto:
      type: object
      properties:
        creationTime:
          type: string
          format: date-time
        hint:
          type: string
    ChargingLocationDto:
      type: object
      properties:
        municipality:
          type: string
        formattedAddress:
          type: string
        streetAddress:
          type: string
        mapMatchedLatitude:
          type: number
        mapMatchedLongitude:
          type: number
      required:
      - formattedAddress
      - municipality
      - streetAddress
    ExVeTelematicDataResponseDto:
      type: object
      properties:
        telematicData:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TelematicDataEntryDto'
    TyreDataDto:
      type: object
      properties:
        dimension:
          $ref: '#/components/schemas/DimensionDto'
        label:
          type: string
        mountingDate:
          $ref: '#/components/schemas/MountingDateDto'
        optimizedForOem:
          $ref: '#/components/schemas/OptimizedForOemDto'
        partNumber:
          $ref: '#/components/schemas/PartNumberDto'
        qualityStatus:
          $ref: '#/components/schemas/QualityStatusDto'
        runFlat:
          $ref: '#/components/schemas/RunFlatDto'
        season:
          $ref: '#/components/schemas/SeasonDto'
        tread:
          $ref: '#/components/schemas/TreadDto'
        tyreDefect:
          $ref: '#/components/schemas/TyreDefectDto'
        tyreProductionDate:
          $ref: '#/components/schemas/TyreProductionDateDto'
        tyreWear:
          $ref: '#/components/schemas/TyreWearDto'
    PublicChargingPointDto:
      type: object
      properties:
        potentialChargingPointMatches:
          type: array
          items:
            $ref: '#/components/schemas/PublicChargingPointMatchesDto'
      required:
      - potentialChargingPointMatches
    DimensionDto:
      type: object
      properties:
        aspectRatio:
          type: integer
          format: int32
        constructionType:
          type: string
        label:
          type: string
        loadIndex:
          type: integer
          format: int32
        rimDiameter:
          type: integer
          format: int32
        sectionWidth:
          type: integer
          format: int32
        speedRating:
          type: string
        value:
          type: string
    RunFlatDto:
      type: object
      properties:
        label:
          type: string
        runFlat:
          type: boolean
        value:
          type: string
    QualityStatusDto:
      type: object
      properties:
        label:
          type: string
        qualityStatus:
          type: string
        value:
          type: string
    LocationBasedChargingTimeWindowDto:
      type: object
      properties:
        startChargingTimePeriodHour:
          type: integer
          format: int32
        startChargingTimePeriodMinute:
          type: integer
          format: int32
        stopChargingTimePeriodHour:
          type: integer
          format: int32
        stopChargingTimePeriodMinute:
          type: integer
          format: int32
    ChargingHistoryResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChargingSessionDto'
        next_token:
          type: string
      required:
      - data
    OptimizedForOemDto:
      type: object
      properties:
        label:
          type: string
        optimizedForOem:
          type: string
        value:
          type: string
    PassengerCarTyreSetDto:
      type: object
      properties:
        aggregatedQualityStatus:
          $ref: '#/components/schemas/AggregatedQualityStatusDto'
        frontLeft:
          $ref: '#/components/schemas/TyreDataDto'
        frontRight:
          $ref: '#/components/schemas/TyreDataDto'
        label:
          type: string
        rearLeft:
          $ref: '#/components/schemas/TyreDataDto'
        rearRight:
          $ref: '#/components/schemas/TyreDataDto'
    ChargingSessionDto:
      type: object
      properties:
        publicChargingPoint:
          $ref: '#/components/schemas/PublicChargingPointDto'
        displayedSoc:
          type: integer
          format: int32
        displayedStartSoc:
          type: integer
          format: int32
        businessErrors:
          type: array
          items:
            $ref: '#/components/schemas/BusinessErrorDto'
        timeZone:
          type: string
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        totalChargingDurationSec:
          type: integer
          format: int32
        energyConsumedFromPowerGridKwh:
          type: number
          format: double
        energyDecreaseHvbKwh:
          type: number
          format: double
          example: '1.2'
        energyDischargedKwh:
          type: number
          format: double
          example: '1.2'
        isPreconditioningActivated:
          type: boolean
        mileage:
          type: integer
          format: int32
          minimum: 0
        mileageUnits:
          type: string
          enum:
          - MileageUnits.KM
          - MileageUnits.MI
        chargingLocation:
          $ref: '#/components/schemas/ChargingLocationDto'
        chargingBlocks:
          type: array
          items:
            $ref: '#/components/schemas/ChargingBlockDto'
      required:
      - displayedSoc
      - displayedStartSoc
      - endTime
      - isPreconditioningActivated
      - mileage
      - mileageUnits
      - startTime
      - timeZone
      - totalChargingDurationSec
    SmartMaintenanceErrorDto:
      type: object
      properties:
        eventId:
          type: string
        message:
          type: object
        type:
          type: string
    VehicleMappingDto:
      type: object
      properties:
        vin:
          type: string
        mappedSince:
          type: string
          format: date-time
        mappingType:
          type: string
          enum:
          - PRIMARY
          - SECONDARY
    SeasonDto:
      type: object
      properties:
        label:
          type: string
        season:
          type: string
        value:
          type: string
    AggregatedQualityStatusDto:
      type: object
      properties:
        label:
          type: string
        qualityStatus:
          type: string
        value:
          type: string
    LocationBasedChargingSettingsDataDto:
      type: object
      properties:
        id:
          type: string
        lastUpdated:
          type: string
        clusterLocationId:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        lastVisit:
          type: string
        visits:
          type: integer
          format: int32
        chargingMode:
          type: string
        optimizedChargingPreference:
          type: string
        startChargingTimePeriodHour:
          type: integer
          format: int32
        startChargingTimePeriodMinute:
          type: integer
          format: int32
        stopChargingTimePeriodHour:
          type: integer
          format: int32
        stopChargingTimePeriodMinute:
          type: integer
          format: int32
        vehicleIdWithGcid:
          type: string
        chargingTimeWindows:
          type: array
          items:
            $ref: '#/components/schemas/LocationBasedChargingTimeWindowDto'
        acCurrentLimitFlag:
          type: string
        acCurrentLimit:
          type: number
          format: double
        acousticLimit:
          type: string
        flapLock:
          type: string
        chargingPlug:
          type: string
    TreadDto:
      type: object
      properties:
        carcass:
          type: string
        label:
          type: string
        manufacturer:
          type: string
        treadDesign:
          type: string
        value:
          type: string
    PublicChargingPointMatchesDto:
      type: object
      properties:
        postalCode:
          type: string
        streetAddress:
          type: string
        providerName:
          type: string
        city:
          type: string
    TelematicDataEntryDto:
      type: object
      properties:
        value:
          type: string
        unit:
          type: string
        timestamp:
          type: string
    TyreProductionDateDto:
      type: object
      properties:
        label:
          type: string
        statusColor:
          type: string
          enum:
          - RED
          - YELLOW
          - GREEN
          - GREY
        value:
          type: string
