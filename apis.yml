aid: bmw-connecteddrive
name: BMW ConnectedDrive
url: https://raw.githubusercontent.com/api-evangelist/bmw-connecteddrive/refs/heads/main/apis.yml
description: >-
  BMW ConnectedDrive is BMW Group's umbrella for connected vehicle services
  spanning navigation, remote services, intelligent emergency call,
  ConnectedDrive Store add-ons, and the My BMW app. Programmatic access for
  customers, third-party developers, and the repair-and-maintenance ecosystem
  is consolidated under the BMW Open Data Platform / BMW CarData. CarData
  exposes an OAuth 2.0 Device Code Flow protected REST API at
  api-cardata.bmwgroup.com for retrieving static vehicle metadata
  (basicData), telematics, charging history, smart maintenance tyre
  diagnosis, location-based charging settings, vehicle images, and managing
  data "containers" that scope which telematics descriptors a client is
  authorized to read. A companion MQTT 3.1.1 streaming service at
  customer.streaming-cardata.bmwgroup.com:9000 (TLS) pushes live container
  data on the per-VIN topic `{gcid}/{vin}`. CarData is the EU regulatory
  successor to the legacy BMW ConnectedDrive REST endpoints used by the My
  BMW app and is the canonical surface for third-party automotive
  integrations, including independent repair, fleet, charging, and
  home-automation use cases.
tags:
